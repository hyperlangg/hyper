name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main] 

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-smoke:
    name: Build + smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps: 
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Git for Windows ships usr\bin\link.exe (POSIX link(1)). Bash puts that
      # directory first on PATH, so rustc invokes it instead of MSVC link.exe.
      - name: Unshadow MSVC link.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitLink = 'C:\Program Files\Git\usr\bin\link.exe'
          if (Test-Path $gitLink) {
            Rename-Item -Path $gitLink -NewName 'link_unix.exe' -Force
            Write-Host "Renamed Git link.exe -> link_unix.exe"
          }
          Write-Host "link.exe => $((Get-Command link.exe).Source)"

      - name: Build
        run: cargo build

      - name: Unit tests
        run: cargo test

      - name: Prepare temp dir
        run: |
          echo "HYPER_TMP=${RUNNER_TEMP}/hyper_ci" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/hyper_ci"

      - name: Resolve exe helper
        run: |
          cat > "$HYPER_TMP/run_exe.sh" << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          bin="$1"
          shift || true
          if [[ -f "${bin}.exe" ]]; then
            exec "${bin}.exe" "$@"
          fi
          exec "$bin" "$@"
          EOF
          chmod +x "$HYPER_TMP/run_exe.sh"

      - name: Diff helper (ignore CRLF)
        run: |
          cat > "$HYPER_TMP/diff_lf.sh" << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          # Ignore CR so Windows AOT stdout (CRLF) matches Unix AOT (LF).
          diff -u <(tr -d '\r' < "$1") <(tr -d '\r' < "$2")
          EOF
          chmod +x "$HYPER_TMP/diff_lf.sh"

      - name: Run (AOT) smoke
        run: cargo run --quiet -- run ci/smoke/smoke.hyp

      - name: Shared list smoke
        run: |
          cargo run --quiet -- run ci/lang/ref_list_share.hyp
          cargo run --quiet -- compile ci/lang/ref_list_share.hyp

      - name: Shared ref payload parity
        run: |
          cargo run --quiet -- run ci/lang/ref_share.hyp > "$HYPER_TMP/ref_run.txt"
          cargo run --quiet -- compile ci/lang/ref_share.hyp > "$HYPER_TMP/ref_compile.txt"
          cargo run --quiet -- compile ci/lang/ref_share.hyp --emit-exe "$HYPER_TMP/hyper_ref_share"
          "$HYPER_TMP/run_exe.sh" "$HYPER_TMP/hyper_ref_share" > "$HYPER_TMP/ref_exe.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/ref_run.txt" "$HYPER_TMP/ref_compile.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/ref_run.txt" "$HYPER_TMP/ref_exe.txt"
          grep -q "\[1, 9\]" "$HYPER_TMP/ref_run.txt"
          grep -q "\[1, 2, 3\]" "$HYPER_TMP/ref_run.txt"
          grep -q "\[1, 2, 9\]" "$HYPER_TMP/ref_run.txt"

      - name: File I/O smoke
        run: |
          cargo run --quiet -- compile ci/io/io_compile.hyp
          rm -f ci_compile_io.txt

      - name: Compiler AOT smoke
        run: cargo run --quiet -- compile ci/smoke/smoke.hyp

      - name: Compiler JSON smoke
        run: |
          cargo run --quiet -- compile ci/io/json_compile.hyp
          rm -f ci_json_compile.json

      - name: Compiler mmap smoke
        run: |
          cargo run --quiet -- compile ci/io/mmap_compile.hyp
          rm -f ci_compile_mmap.txt

      - name: Compiler input smoke
        run: |
          printf 'hello\nworld\n' | cargo run --quiet -- compile ci/io/input_compile.hyp

      - name: Compiler clock smoke
        run: cargo run --quiet -- compile ci/io/clock_compile.hyp

      - name: Compiler collection methods smoke
        run: cargo run --quiet -- compile ci/collections/collections_compile.hyp

      - name: Compiler dict hash-map smoke
        run: cargo run --quiet -- compile ci/collections/dict_compile.hyp

      - name: Empty collections smoke
        run: |
          printf '{}\n0\n[]\n' > "$HYPER_TMP/empty_expected.txt"
          cargo run --quiet -- run ci/collections/empty_collections.hyp > "$HYPER_TMP/empty_run.txt"
          cargo run --quiet -- compile ci/collections/empty_collections.hyp > "$HYPER_TMP/empty_compile.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/empty_expected.txt" "$HYPER_TMP/empty_run.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/empty_expected.txt" "$HYPER_TMP/empty_compile.txt"
      - name: Negative index output parity
        run: |
          printf '30\nNone\n[10, 20, 99]\n2\n[1, 2, 7]\n' > "$HYPER_TMP/negative_index_expected.txt"
          cargo run --quiet -- run ci/collections/negative_indexes.hyp > "$HYPER_TMP/negative_index_run.txt"
          cargo run --quiet -- compile ci/collections/negative_indexes.hyp > "$HYPER_TMP/negative_index_compile.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/negative_index_expected.txt" "$HYPER_TMP/negative_index_run.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/negative_index_expected.txt" "$HYPER_TMP/negative_index_compile.txt"

      - name: Compiler builtins smoke
        run: cargo run --quiet -- compile ci/collections/builtins_compile.hyp

      - name: Compiler string methods smoke
        run: cargo run --quiet -- compile ci/collections/strings_compile.hyp

      - name: ASCII whitespace output parity
        run: |
          cargo run --quiet -- run ci/collections/ascii_whitespace.hyp > "$HYPER_TMP/ascii_ws_run.txt"
          cargo run --quiet -- compile ci/collections/ascii_whitespace.hyp > "$HYPER_TMP/ascii_ws_compile.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/ascii_ws_run.txt" "$HYPER_TMP/ascii_ws_compile.txt"

      - name: Typecheck smoke
        run: cargo run --quiet -- typecheck ci/smoke.hyp

      - name: Break and continue smoke
        run: cargo run --quiet -- compile ci/control/break_continue.hyp

      - name: Raise and handle smoke
        run: |
          cargo run --quiet -- compile ci/control/raise_handle.hyp > "$HYPER_TMP/rh_compile.txt"
          cargo run --quiet -- run ci/control/raise_handle.hyp > "$HYPER_TMP/rh_run.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/rh_run.txt" "$HYPER_TMP/rh_compile.txt"

      - name: Traits smoke
        run: cargo run --quiet -- compile ci/lang/traits_compile.hyp

      - name: Pub and mut smoke
        run: cargo run --quiet -- compile ci/lang/pub_mut.hyp

      - name: Ref smoke
        run: cargo run --quiet -- compile ci/lang/ref_compile.hyp

      - name: Integer widths smoke
        run: |
          cargo run --quiet -- run ci/int_widths.hyp
          cargo run --quiet -- compile ci/int_widths.hyp

      - name: Vectorize and parallel smoke
        run: cargo run --quiet -- compile ci/lang/vectorize_compile.hyp

      - name: Compiler emit-obj smoke
        run: |
          cargo run --quiet -- compile ci/smoke/smoke.hyp --emit-obj "$HYPER_TMP/hyper_smoke_obj.o"
          test -s "$HYPER_TMP/hyper_smoke_obj.o" || { echo "error: emit-obj produced empty object file !"; exit 1; }

      - name: Compiler emit-llvm smoke
        run: |
          cargo run --quiet -- compile ci/smoke/smoke.hyp --emit-llvm "$HYPER_TMP/hyper_smoke.ll"
          test -s "$HYPER_TMP/hyper_smoke.ll" || { echo "error: emit-llvm produced an empty file"; exit 1; }
          grep -q "define" "$HYPER_TMP/hyper_smoke.ll"
          grep -q "target triple" "$HYPER_TMP/hyper_smoke.ll"

      - name: Compiler emit-exe smoke
        run: |
          cargo run --quiet -- compile ci/smoke/smoke.hyp --emit-exe "$HYPER_TMP/hyper_smoke"
          "$HYPER_TMP/run_exe.sh" "$HYPER_TMP/hyper_smoke"

      - name: Compiler emit-exe collections smoke
        run: |
          cargo run --quiet -- compile ci/collections/collections_compile.hyp --emit-exe "$HYPER_TMP/hyper_coll"
          "$HYPER_TMP/run_exe.sh" "$HYPER_TMP/hyper_coll"

      - name: Compiler emit-exe dict hash-map smoke
        run: |
          cargo run --quiet -- compile ci/collections/dict_compile.hyp --emit-exe "$HYPER_TMP/hyper_dict"
          "$HYPER_TMP/run_exe.sh" "$HYPER_TMP/hyper_dict"

      - name: Compiler emit-exe strings smoke
        run: |
          cargo run --quiet -- compile ci/collections/strings_compile.hyp --emit-exe "$HYPER_TMP/hyper_str"
          "$HYPER_TMP/run_exe.sh" "$HYPER_TMP/hyper_str"

      - name: Compiler emit-exe break and continue smoke
        run: |
          cargo run --quiet -- compile ci/control/break_continue.hyp --emit-exe "$HYPER_TMP/hyper_bc"
          "$HYPER_TMP/run_exe.sh" "$HYPER_TMP/hyper_bc"

      - name: Compiler emit-exe raise and handle smoke
        run: |
          cargo run --quiet -- compile ci/control/raise_handle.hyp --emit-exe "$HYPER_TMP/hyper_rh"
          "$HYPER_TMP/run_exe.sh" "$HYPER_TMP/hyper_rh" > "$HYPER_TMP/rh_exe.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/rh_compile.txt" "$HYPER_TMP/rh_exe.txt"

      - name: Division by zero
        run: |
          set +e
          cargo run --quiet -- run ci/control/divzero.hyp > "$HYPER_TMP/dz_run.txt" 2>&1
          run_code=$?
          cargo run --quiet -- compile ci/control/divzero.hyp > "$HYPER_TMP/dz_compile.txt" 2>&1
          compile_code=$?
          set -e
          test "$run_code" -eq 70
          test "$compile_code" -eq 70
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/dz_run.txt" "$HYPER_TMP/dz_compile.txt"

      - name: Division by zero modulo
        run: |
          set +e
          cargo run --quiet -- run ci/control/divzero_mod.hyp > "$HYPER_TMP/dzm_run.txt" 2>&1
          run_code=$?
          cargo run --quiet -- compile ci/control/divzero_mod.hyp > "$HYPER_TMP/dzm_compile.txt" 2>&1
          compile_code=$?
          set -e
          test "$run_code" -eq 70
          test "$compile_code" -eq 70
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/dzm_run.txt" "$HYPER_TMP/dzm_compile.txt"

      - name: Literal divison by zero modulo
        run: |
          set +e
          cargo run --quiet -- run ci/control/literal_divzero_mod.hyp > "$HYPER_TMP/ldzm_run.txt" 2>&1
          run_code=$?
          cargo run --quiet -- compile ci/control/literal_divzero_mod.hyp > "$HYPER_TMP/ldzm_compile.txt" 2>&1
          compile_code=$?
          set -e
          test "$run_code" -eq 65
          test "$compile_code" -eq 65
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/ldzm_run.txt" "$HYPER_TMP/ldzm_compile.txt"

      - name: Division by zero (divmod)
        run: |
          set +e
          cargo run --quiet -- run ci/control/divzero_divmod.hyp > "$HYPER_TMP/dzd_run.txt" 2>&1
          run_code=$?
          cargo run --quiet -- compile ci/control/divzero_divmod.hyp > "$HYPER_TMP/dzd_compile.txt" 2>&1
          compile_code=$?
          set -e
          test "$run_code" -eq 70
          test "$compile_code" -eq 70
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/dzd_run.txt" "$HYPER_TMP/dzd_compile.txt"

      - name: Literal division by zero (divmod)
        run: |
          set +e
          cargo run --quiet -- run ci/control/literal_divzero_divmod.hyp > "$HYPER_TMP/ldzd_run.txt" 2>&1
          run_code=$?
          cargo run --quiet -- compile ci/control/literal_divzero_divmod.hyp > "$HYPER_TMP/ldzd_compile.txt" 2>&1
          compile_code=$?
          set -e
          test "$run_code" -eq 65
          test "$compile_code" -eq 65
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/ldzd_run.txt" "$HYPER_TMP/ldzd_compile.txt"


      - name: Literal division by zero (compile-time)
        run: |
          set +e
          cargo run --quiet -- typecheck ci/control/literal_divzero.hyp > "$HYPER_TMP/ldz.txt" 2>&1
          tc_code=$?
          cargo run --quiet -- compile ci/control/literal_divzero.hyp > "$HYPER_TMP/ldz_c.txt" 2>&1
          c_code=$?
          set -e
          test "$tc_code" -eq 65
          test "$c_code" -eq 65
          grep -q "division by zero" "$HYPER_TMP/ldz.txt"
          grep -q "division by zero" "$HYPER_TMP/ldz_c.txt"

      - name: Run and compile output parity
        run: |
          cargo run --quiet -- run ci/smoke/smoke.hyp > "$HYPER_TMP/out_run.txt"
          cargo run --quiet -- compile ci/smoke/smoke.hyp > "$HYPER_TMP/out_compile.txt"
          "$HYPER_TMP/run_exe.sh" "$HYPER_TMP/hyper_smoke" > "$HYPER_TMP/out_exe.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/out_run.txt" "$HYPER_TMP/out_compile.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/out_run.txt" "$HYPER_TMP/out_exe.txt"

      - name: Break and continue output parity
        run: |
          cargo run --quiet -- run ci/control/break_continue.hyp > "$HYPER_TMP/bc_run.txt"
          cargo run --quiet -- compile ci/control/break_continue.hyp > "$HYPER_TMP/bc_compile.txt"
          "$HYPER_TMP/run_exe.sh" "$HYPER_TMP/hyper_bc" > "$HYPER_TMP/bc_exe.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/bc_run.txt" "$HYPER_TMP/bc_compile.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/bc_run.txt" "$HYPER_TMP/bc_exe.txt"

      - name: range step output parity
        run: |
          cargo run --quiet -- run ci/control/range_step.hyp > "$HYPER_TMP/rs_run.txt"
          cargo run --quiet -- compile ci/control/range_step.hyp > "$HYPER_TMP/rs_compile.txt"
          cargo run --quiet -- compile ci/control/range_step.hyp --emit-exe "$HYPER_TMP/hyper_range_step"
          "$HYPER_TMP/run_exe.sh" "$HYPER_TMP/hyper_range_step" > "$HYPER_TMP/rs_exe.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/rs_run.txt" "$HYPER_TMP/rs_compile.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/rs_run.txt" "$HYPER_TMP/rs_exe.txt"
          grep -qx "0" "$HYPER_TMP/rs_run.txt"
          grep -q "\[1, 4, 7\]" "$HYPER_TMP/rs_run.txt"
          grep -q "\[5, 3, 1\]" "$HYPER_TMP/rs_run.txt"

      - name: sorted and reversed output parity
        run: |
          cargo run --quiet -- run ci/collections/sorted_reversed.hyp > "$HYPER_TMP/sr_run.txt"
          cargo run --quiet -- compile ci/collections/sorted_reversed.hyp > "$HYPER_TMP/sr_compile.txt"
          cargo run --quiet -- compile ci/collections/sorted_reversed.hyp --emit-exe "$HYPER_TMP/hyper_sorted_reversed"
          "$HYPER_TMP/run_exe.sh" "$HYPER_TMP/hyper_sorted_reversed" > "$HYPER_TMP/sr_exe.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/sr_run.txt" "$HYPER_TMP/sr_compile.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/sr_run.txt" "$HYPER_TMP/sr_exe.txt"
          grep -q "\[1, 2, 3\]" "$HYPER_TMP/sr_run.txt"
          grep -q "\[3, 2, 1\]" "$HYPER_TMP/sr_run.txt"
          grep -q "\[a, b, c\]" "$HYPER_TMP/sr_run.txt"

      - name: Unicode case output parity
        run: |
          cargo run --quiet -- run ci/collections/unicode_case.hyp > "$HYPER_TMP/uc_run.txt"
          cargo run --quiet -- compile ci/collections/unicode_case.hyp > "$HYPER_TMP/uc_compile.txt"
          cargo run --quiet -- compile ci/collections/unicode_case.hyp --emit-exe "$HYPER_TMP/hyper_unicode_case"
          "$HYPER_TMP/run_exe.sh" "$HYPER_TMP/hyper_unicode_case" > "$HYPER_TMP/uc_exe.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/uc_run.txt" "$HYPER_TMP/uc_compile.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/uc_run.txt" "$HYPER_TMP/uc_exe.txt"
          grep -q "STRASSE" "$HYPER_TMP/uc_run.txt"
          grep -q "ПРИВЕТ" "$HYPER_TMP/uc_run.txt"
          grep -qx "false" "$HYPER_TMP/uc_run.txt" && { echo "unicode case assertion failed"; exit 1; }
          true
